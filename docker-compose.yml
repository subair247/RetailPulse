version: '3.8'

services:
  retailpulse-app:
    build: .
    container_name: retailpulse_command_center
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
    networks:
      - retail_net

networks:
  retail_net:
    driver: bridge